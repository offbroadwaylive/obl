name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild at 08:00 UTC (midnight or 1am in San Diego), so past
  # performances drop off and shows with no dates leave the nav on their own.
  # It reads only committed data; nothing polls the content sheet.
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/build-deploy.yml
